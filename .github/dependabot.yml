version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
